<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtherAngle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .prose h1 { font-size: 1.875rem; line-height: 2.25rem; font-weight: 800; }
        .prose h2 { font-size: 1.5rem; line-height: 2rem; font-weight: 700; }
        .prose h3 { font-size: 1.25rem; line-height: 1.75rem; font-weight: 600; }
        .prose p { margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose strong { font-weight: 700; }
        .prose ul { list-style-type: disc; padding-left: 1.5em; margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose ol { list-style-type: decimal; padding-left: 1.5em; margin-top: 1.25em; margin-bottom: 1.25em; }
        .prose li { margin-top: 0.5em; margin-bottom: 0.5em; }
        .prose blockquote { margin-top: 1.5em; margin-bottom: 1.5em; border-left-width: 4px; border-color: #e5e7eb; padding-left: 1em; font-style: italic; }
        .prose code { font-family: monospace; background-color: #f3f4f6; padding: 0.2em 0.4em; margin: 0; font-size: 85%; border-radius: 3px; }
        .prose pre { font-family: monospace; background-color: #f3f4f6; padding: 1em; border-radius: 6px; overflow: auto; }
        .prose pre code { background-color: transparent; padding: 0; margin: 0; font-size: inherit; border-radius: 0; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">

    <div id="main-content" class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">テーマ</h1>
        
        <form class="text-center mb-8" action="{{ url_for('setForm') }}" onsubmit="event.preventDefault(); setLoading();">
            <div class="mb-4">
                <label for="theme" class="sr-only">テーマ</label>
                <input type="text" id="theme-input" name="theme" class="w-full max-w-lg mx-auto text-2xl p-4 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ theme_input }}" placeholder="ここにテーマを入力してください"/>
            </div>
            <div>
                <input type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full cursor-pointer text-xl" value="出力" />
            </div>    
        </form>

        <div class="grid md:grid-cols-3 gap-8" id="Advices">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-2xl font-bold mb-2">{{ content_dict.view1 }}</h3>
                <div class="prose">{{ content_dict.content1 | safe }}</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-2xl font-bold mb-2">{{ content_dict.view2 }}</h3>
                <div class="prose">{{ content_dict.content2 | safe }}</div>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-2xl font-bold mb-2">{{ content_dict.view3 }}</h3>
                <div class="prose">{{ content_dict.content3 | safe }}</div>
            </div>
        </div>
    </div>

    <div id="loading-container" class="hidden fixed top-0 left-0 w-full h-full bg-gray-100 z-50">
        <div id="tree-container" class="w-full h-full"></div>
        <div id="loading-text" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl font-bold text-gray-800"></div>
    </div>

    <script>
        (function() {
    function TreePlugin(options) {
        options = options || {};
        this.container = options.container || document.body;
        this.fullDepth = 11;
        this.depth = options.depth || this.fullDepth;
        this.pixelRatio = window.devicePixelRatio > 1 ? 2 : 1;
        this.growthSpeed = options.growthSpeed || 1;
        this.treeScale = options.treeScale || 1;
        this.branchWidth = options.branchWidth || 1;
        this.colorMode = options.colorMode || "gradient"; // "gradient" or "solid"
        this.color = options.color || "#000";
        this.gradientStart = options.gradientStart || "#8B4513";
        this.gradientEnd = options.gradientEnd || "#228B22";
        this.seed = options.seed !== undefined ? Number(options.seed) : undefined;

        if (this.seed !== undefined) {
            var totalCount = 10000;
            this.randSeq = [];
            var s = this.seed;
            for (var i = 0; i < totalCount; i++) {
                s = (s * 16807) % 2147483647;
                var rnd = (s - 1) / 2147483646;
                this.randSeq.push(rnd);
            }
            this.randCounter = 0;
        }

        this.canvas = document.createElement("canvas");
        this.container.appendChild(this.canvas);
        this.ctx = this.canvas.getContext("2d");
        this.branches = [];
        this.animation = null;
        this.currentDepth = 0;

        this.addEventListeners();
        this.resize();
        this.startTree(this.stageWidth / 2, this.stageHeight);
    }

    TreePlugin.prototype.addEventListeners = function () {
        window.addEventListener("resize", this.resize.bind(this));
    };

    TreePlugin.prototype.resize = function () {
        this.stageWidth = this.container.clientWidth;
        this.stageHeight = this.container.clientHeight;
        this.canvas.width = this.stageWidth * this.pixelRatio;
        this.canvas.height = this.stageHeight * this.pixelRatio;
        this.ctx.setTransform(this.pixelRatio, 0, 0, this.pixelRatio, 0, 0);
        this.clearCanvas();
    };

    TreePlugin.prototype.clearCanvas = function () {
        this.ctx.clearRect(0, 0, this.stageWidth, this.stageHeight);
    };

    TreePlugin.prototype.startTree = function (posX, posY) {
        if (this.animation) cancelAnimationFrame(this.animation);
        this.clearCanvas();
        if (this.seed !== undefined) {
            this.randCounter = 0;
        }
        this.branches = Array.from({ length: this.formationRule(0) }, (_, i) => {
            return new Branch(
                this,
                posX,
                posY,
                -90,
                0,
                this.colorMode === "gradient" ? this.gradientStart : this.color
            );
        });
        this.currentDepth = 0;
        this.animation = requestAnimationFrame(this.animate.bind(this));
    };

    TreePlugin.prototype.animate = function () {
        var isDone = true;
        this.branches.forEach((branch) => {
            if (!branch.isDone) {
                isDone = false;
                branch.grow();
            }
        });

        if (isDone && this.currentDepth <= this.depth) {
            this.currentDepth++;
            var newBranches = [];
            this.branches.forEach((branch) => {
                if (branch.canBranch) {
                    var children = Array.from({ length: this.formationRule(this.currentDepth) }, () => {
                        return branch.createChild();
                    });
                    newBranches.push(...children);
                }
            });
            this.branches.push(...newBranches);
            this.animation = requestAnimationFrame(this.animate.bind(this));
        } else if (isDone && this.currentDepth > this.depth) {
            cancelAnimationFrame(this.animation);
        } else {
            this.animation = requestAnimationFrame(this.animate.bind(this));
        }
    };

    TreePlugin.prototype.rand = function () {
        if (this.seed !== undefined) {
            if (this.randCounter >= this.randSeq.length) {
                this.randCounter = 0;
            }
            return this.randSeq[this.randCounter++];
        } else {
            return Math.random();
        }
    };

    TreePlugin.prototype.formationRule = function (depth) {
        if (depth === 0) {
            return 1;
        } else {
            return this.rand() > 0.4 ? 2 : 1;
        }
    };

    function Branch(tree, posX, posY, angle, depth, color) {
        this.tree = tree;
        this.posX = posX;
        this.posY = posY;
        this.angle = angle;
        this.depth = depth;
        this.color = color;
        this.isDone = false;
        this.canBranch = true;

        this.totalLength = (this.tree.rand() * 0.5 + 0.5) * (this.tree.stageHeight / (this.depth + 3)) * this.tree.treeScale;
        this.currentLength = 0;
        this.width = (this.tree.depth - this.depth) * 0.5 * this.tree.branchWidth;
    }

    Branch.prototype.grow = function () {
        if (this.isDone) return;

        var growth = this.tree.growthSpeed * (this.tree.rand() * 0.5 + 0.5);
        this.currentLength += growth;

        if (this.currentLength >= this.totalLength) {
            this.currentLength = this.totalLength;
            this.isDone = true;
        }

        var rad = (this.angle * Math.PI) / 180;
        var newX = this.posX + this.currentLength * Math.cos(rad);
        var newY = this.posY + this.currentLength * Math.sin(rad);

        this.tree.ctx.beginPath();
        this.tree.ctx.moveTo(this.posX, this.posY);
        this.tree.ctx.lineTo(newX, newY);
        this.tree.ctx.lineWidth = this.width;
        this.tree.ctx.strokeStyle = this.color;
        this.tree.ctx.stroke();
    };

    Branch.prototype.createChild = function () {
        var newAngle = this.angle + (this.tree.rand() * 60 - 30);
        var newDepth = this.depth + 1;
        var rad = (this.angle * Math.PI) / 180;
        var newX = this.posX + this.totalLength * Math.cos(rad);
        var newY = this.posY + this.totalLength * Math.sin(rad);
        var newColor;

        if (this.tree.colorMode === "gradient") {
            var ratio = newDepth / this.tree.depth;
            newColor = this.tree.ctx.createLinearGradient(0, 0, 0, this.tree.stageHeight);
            var startColor = this.tree.gradientStart;
            var endColor = this.tree.gradientEnd;
            var r1 = parseInt(startColor.substring(1, 3), 16);
            var g1 = parseInt(startColor.substring(3, 5), 16);
            var b1 = parseInt(startColor.substring(5, 7), 16);
            var r2 = parseInt(endColor.substring(1, 3), 16);
            var g2 = parseInt(endColor.substring(3, 5), 16);
            var b2 = parseInt(endColor.substring(5, 7), 16);
            var r = Math.round(r1 + (r2 - r1) * ratio);
            var g = Math.round(g1 + (g2 - g1) * ratio);
            var b = Math.round(b1 + (b2 - b1) * ratio);
            newColor = `rgb(${r}, ${g}, ${b})`;
        } else {
            newColor = this.tree.color;
        }

        return new Branch(this.tree, newX, newY, newAngle, newDepth, newColor);
    };

    window.TreePlugin = TreePlugin;
})();

        const seePoints = ["科学的","歴史","社会","経済","国語","古典","研究","化学","論理","地理","芸術","音楽","宗教","道徳","商業","福祉","数学","生物","技術","家庭","情報","保険","体育","工業","医学","農業","水産","介護","対照的","ポジティブな","物理的","原理的","表層的","類似","異質","感情的","データから","効率的","効果の","プログラミング的","客観的","史実的(事実ベースの考え方)","権利的","コスパ","独自性"];
        let tree;

        function setLoading(){
            document.getElementById('main-content').classList.add('hidden');
            document.getElementById('loading-container').classList.remove('hidden');

            const treeContainer = document.getElementById('tree-container');
            tree = new TreePlugin({
                container: treeContainer,
                depth: 8,
                growthSpeed: 2,
                treeScale: 1.5,
                branchWidth: 2,
                gradientStart: '#6b4a2f',
                gradientEnd: '#a37b58'
            });

            const loadingText = document.getElementById('loading-text');
            let wordIndex = 0;
            const interval = setInterval(() => {
                if (wordIndex < seePoints.length) {
                    loadingText.textContent = seePoints[wordIndex];
                    wordIndex++;
                } else {
                    wordIndex = 0;
                }
            }, 200);

            // Prevent form submission for this example
            // In a real scenario, you would submit the form after setting up the loading animation
            setTimeout(() => {
                 const theme = document.getElementById('theme-input').value;
                 window.location.href = `/setForm?theme=${encodeURIComponent(theme)}`;
            }, 5000); // Simulate a 5 second loading time
        }
    </script>
</body>
</html>
