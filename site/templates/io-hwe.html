<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtherAngle</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">

    <div class="container mx-auto px-4 py-8">
        <h1 class="text-4xl font-bold text-center mb-8">テーマ</h1>
        
        <form class="text-center mb-8" action="{{ url_for('setForm') }}" onsubmit="setLoading()">
            <div class="mb-4">
                <label for="theme" class="sr-only">テーマ</label>
                <input type="text" name="theme" class="w-full max-w-lg mx-auto text-2xl p-4 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500" value="{{ theme_input }}" placeholder="ここにテーマを入力してください"/>
            </div>
            <div>
                <input type="submit" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full cursor-pointer text-xl" value="出力" />
            </div>    
        </form>

        <div id="loading" class="hidden text-center">
            <div class="inline-block animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-blue-500"></div>
            <p class="mt-4 text-lg">推論中 - 1分半程度かかります</p>
        </div>

        <div class="grid md:grid-cols-3 gap-8" id="Advices">
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-2xl font-bold mb-2">{{ content_dict.view1 }}</h3>
                <p>{{ content_dict.content1 }}</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-2xl font-bold mb-2">{{ content_dict.view2 }}</h3>
                <p>{{ content_dict.content2 }}</p>
            </div>
            <div class="bg-white p-6 rounded-lg shadow-md">
                <h3 class="text-2xl font-bold mb-2">{{ content_dict.view3 }}</h3>
                <p>{{ content_dict.content3 }}</p>
            </div>
        </div>
    </div>

    <script>
        function setLoading(){
            document.getElementById('Advices').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');
        }
    </script>
</body>
</html>
